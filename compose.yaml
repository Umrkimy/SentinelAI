services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelai-postgres
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sentinelai:${POSTGRES_PASSWORD}@postgres:5432/sentinelai
      SENTINELAI_ADMIN_USERNAME: ${SENTINELAI_ADMIN_USERNAME}
      SENTINELAI_ADMIN_PASSWORD_HASH: ${SENTINELAI_ADMIN_PASSWORD_HASH}
      SENTINELAI_JWT_SECRET: ${SENTINELAI_JWT_SECRET}
    volumes:
      - ./data/documents/raw:/app/data/documents/raw:ro
      - ./data/documents/sources.json:/app/data/documents/sources.json:ro
      - ./data/documents/processed:/app/data/documents/processed
      - ./data/documents/uploads:/app/data/documents/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      BACKEND_URL: http://backend:8000
    depends_on:
      mqtt:
        condition: service_started
      backend:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3500:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
